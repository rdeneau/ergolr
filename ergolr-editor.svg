<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 404">
  <style>
    :root { color-scheme: light dark; }
    rect, path, circle { fill: #fff; stroke: #666; stroke-width: .5px; }
    text { fill: #444; font: normal 18px sans-serif; text-anchor: middle; }

    .level1  { font-size: 18px; }
    .level2  { font-size: 12px; fill: #888; }
    .letter  { font-size: 16px; }
    .pair    { font-size: 16px; font-weight: bold; }
    .accent  { font-size: 13px; fill: #2a7; }
    .accent2 { font-size: 12px; fill: #6b6; }
    .sym     { font-size: 10px; fill: #7370a9; text-anchor: start; }
    .nav     { font-size: 10px; fill: #e83; text-anchor: end; }
    .cap     { font-size: 12px; }
    .capTL   { font-size: 11px; text-anchor: start; }
    .accent.word { font-size: 10px; }
    .exit    { font-size: 10px; fill: #888; }
    .ghost   { font-size: 11px; fill: #888; text-anchor: start; }
    .act     { font-size: 12px; fill: #0a8; font-weight: bold; }   /* what the key does */
    .chord   { font-size: 9px; fill: #888; }                       /* the shortcut it sends */
    .deadKey { fill: #e33; }
    .big     { font-size: 22px; }
    .specialKey rect { fill: #e4e4e4; }
    .title   { font-size: 15px; text-anchor: start; fill: #333; }
    .legend  { font-size: 11px; text-anchor: start; }
    .legend tspan { text-anchor: start; }
    .encTitle { font-size: 12px; }
    .encText  { font-size: 9px; text-anchor: start; }
    .encoder circle { fill: #f0f0f0; }

    #left  { transform: translate(  4px, 124px); }
    #right { transform: translate(480px, 124px); }

    /* column stagger */
    .col_L { transform: translate(  0px, 22.5px); }
    .col_1 { transform: translate( 60px, 22.5px); }
    .col_2 { transform: translate(120px,  7.5px); }
    .col_3 { transform: translate(180px,  0.0px); }
    .col_4 { transform: translate(240px,  7.5px); }
    .col_5 { transform: translate(300px, 15.0px); }
    .ext_L { transform: translate(360px, 120.0px); }

    .col_6 { transform: translate(  0px, 15.0px); }
    .col_7 { transform: translate( 60px,  7.5px); }
    .col_8 { transform: translate(120px,  0.0px); }
    .col_9 { transform: translate(180px,  7.5px); }
    .col_0 { transform: translate(240px, 22.5px); }
    .col_R { transform: translate(300px, 22.5px); }
    .ext_R { transform: translate(-60px, 120.0px); }

    /* thumb clusters, positioned with magic numbers */
    .thb_1 { transform: translate( 90px, 205px); }
    .thb_2 { transform: translate(150px, 190px); }
    .thb_3 { transform: translate(210px, 190px); }
    .thb_4 { transform: translate(280px, 191px); }
    .thb_5 { transform: translate(360px, 182px); }
    .thb_4 g { transform: rotate(12deg); }
    .thb_5 g { transform: rotate(24deg); }

    .thb_0 { transform: translate(210px, 205px); }
    .thb_9 { transform: translate(150px, 190px); }
    .thb_8 { transform: translate( 90px, 190px); }
    .thb_7 { transform: translate( 20px, 201px); }
    .thb_6 { transform: translate(-57px, 201px); }
    .thb_7 g { transform: rotate(-12deg); }
    .thb_6 g { transform: rotate(-24deg); }

    /* the two layer keys carry the colour of the layer they reach */
    #sym rect { fill: #99f; }
    #nav rect { fill: #e83; }
    #dk  rect { fill: #f99; }
    #edit rect { fill: #7dd; }

    @media (prefers-color-scheme: dark) {
      rect, path, circle { fill: #444; }
      text             { fill: #bbb; }
      .specialKey rect { fill: #333; }
      .encoder circle  { fill: #3a3a3a; }
      .level2          { fill: #888; }
      .accent          { fill: #6b6; }
      .accent2         { fill: #4a4; }
      .ghost           { fill: #999; }
      .title           { fill: #ccc; }
      .exit            { fill: #999; }
      #sym rect        { fill: #77d; }
      #nav rect        { fill: #c72; }
      #dk  rect        { fill: #b44; }
      #edit rect       { fill: #277; }
      .act             { fill: #5cc; }
      .chord           { fill: #999; }
      #sym text, #nav text, #dk text, #edit text { fill: #fff; }
    }
  </style>

  <text x="8" y="22" class="title">✂️ Editor layer</text>
  <text x="8" y="42" class="legend">hold the left thumb <tspan class="act">Enter</tspan> • double tap locks the layer • <tspan class="exit">Esc</tspan> leaves it</text>
  <g class="encoder">
    <text x="418" y="170" class="encTitle">
      <tspan class="act" style="text-anchor: middle; font-size: larger">Selection</tspan>
    </text>
    <circle cx="390" cy="212" r="26"/>
    <text x="372" y="209" class="encText">↶ Shrink</text>
    <text x="372" y="221" class="encText">↷ Extend</text>
    <circle cx="446" cy="212" r="26"/>
    <text x="428" y="209" class="encText">↶ − occur.</text>
    <text x="428" y="221" class="encText">↷ + occur.</text>
  </g>
  <g id="left">
    <g class="col_L specialKey">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Esc</text>
        <text x="26" y="46" class="chord">Base</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Tab</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Shift</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Ctrl</text>
      </g>
    </g>
    <g class="col_1">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">1</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Q</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">A</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Z</text>
      </g>
    </g>
    <g class="col_2">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">2</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">B</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">S</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">X</text>
      </g>
    </g>
    <g class="col_3">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">3</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">O</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">E</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">C</text>
      </g>
    </g>
    <g class="col_4">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">4</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">P</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">N</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">V</text>
      </g>
    </g>
    <g class="col_5">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">5</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">W</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">F</text>
        <text x="26" y="33" class="act">Format</text>
        <text x="26" y="45" class="chord">Ctrl+K D</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost"></text>
      </g>
    </g>
    <g class="ext_L specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="26" y="33" class="act">Select</text>
        <text x="26" y="45" class="chord">All</text>
      </g>
    </g>
    <g class="thb_5 specialKey" id="edit">
      <g>
        <rect width="52" height="82" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Enter</text>
      </g>
    </g>
    <g class="thb_4 specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Del</text>
      </g>
    </g>
    <g class="thb_3 specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Right</text>
      </g>
    </g>
    <g class="thb_2 specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Left</text>
      </g>
    </g>
    <g class="thb_1 specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Alt</text>
      </g>
    </g>
  </g>
  <g id="right">
    <g class="col_6">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">6</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">J</text>
        <text x="26" y="33" class="act">Cut</text>
        <text x="26" y="45" class="chord">Ctrl+X</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">L</text>
        <text x="26" y="33" class="act">Copy</text>
        <text x="26" y="45" class="chord">Ctrl+C</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">.</text>
        <text x="26" y="33" class="act">Paste</text>
        <text x="26" y="45" class="chord">Ctrl+V</text>
      </g>
    </g>
    <g class="col_7">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">7</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">M</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">R</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">H</text>
        <text x="26" y="33" class="act">Paste+</text>
        <text x="26" y="45" class="chord">plain text</text>
      </g>
    </g>
    <g class="col_8">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">8</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">D</text>
        <text x="26" y="33" class="act">Duplic.</text>
        <text x="26" y="45" class="chord">Ctrl+D</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">T</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">G</text>
      </g>
    </g>
    <g class="col_9">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">9</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">★</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">I</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">-</text>
      </g>
    </g>
    <g class="col_0">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">0</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Y</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">U</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">K</text>
      </g>
    </g>
    <g class="col_R specialKey">
      <g transform="translate(0 -60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">=</text>
      </g>
      <g transform="translate(0 0)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">*</text>
      </g>
      <g transform="translate(0 60)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">?</text>
      </g>
      <g transform="translate(0 120)">
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost"> <!-- PrtScr --> </text>
      </g>
    </g>
    <g class="ext_R specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="26" y="33" class="act">Select</text>
        <text x="26" y="45" class="chord">All occur.</text>
      </g>
    </g>
    <g class="thb_6 specialKey">
      <g>
        <rect width="52" height="82" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Space</text>
      </g>
    </g>
    <g class="thb_7 specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Backsp</text>
      </g>
    </g>
    <g class="thb_8 specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Up</text>
      </g>
    </g>
    <g class="thb_9 specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Down</text>
      </g>
    </g>
    <g class="thb_0 specialKey">
      <g>
        <rect width="52" height="52" rx="5" ry="5"/>
        <text x="13" y="15" class="ghost">Win</text>
      </g>
    </g>
  </g>
</svg>
